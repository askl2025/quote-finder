name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd client
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build Windows executable
        run: |
          cd client
          pyinstaller --onefile --windowed --name quote-finder main.py
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: client/dist/quote-finder.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Buildozer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            python3 \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libffi-dev \
            libltdl-dev \
            openjdk-17-jdk
      
      - name: Install Buildozer
        run: |
          pip install buildozer
          pip install cython
      
      - name: Build Android APK
        run: |
          cd client
          buildozer android debug
        timeout-minutes: 60
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: client/bin/*.apk

  create-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
      
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
      
      - name: List files
        run: ls -la
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            quote-finder.exe
            *.apk
          generate_release_notes: true
          draft: false
          prerelease: false
